name: Publish NuGet Package

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          source-url: https://nuget.pkg.github.com/PepperDash-Engineering/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore ZrcSdkTest.sln

      - name: Build
        run: dotnet build ZrcSdkTest.sln --no-restore --configuration Release

      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/ZrcSdkLib/ZrcSdkLib.csproj \
            --no-build \
            --configuration Release \
            -p:Version="$VERSION" \
            --output ./artifacts

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://nuget.pkg.github.com/PepperDash-Engineering/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
